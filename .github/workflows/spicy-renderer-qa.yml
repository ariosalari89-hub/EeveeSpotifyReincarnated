name: Spicy Lyrics UIKit and WebKit QA

on:
  workflow_dispatch:

jobs:
  renderer-qa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'
      - name: Run production renderer in UIKit and WebKit
        run: bash Tests/SpicyLyricsIOS/run.sh
      - name: Upload all visual and integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpicyLyrics-UIKit-Visual-QA
          path: |
            ${{ runner.temp }}/spicy-ios-qa-result.txt
            ${{ runner.temp }}/qa-*.png
          if-no-files-found: error
