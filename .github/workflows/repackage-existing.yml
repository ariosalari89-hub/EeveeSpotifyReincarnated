name: Repackage Existing IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the renderer sources
        required: true
        default: Master
        type: string
      base_run_id:
        description: Successful run containing the known-working EeveeSpotify-IPA artifact
        required: true
        type: string
      deb_run_id:
        description: Successful run containing the freshly compiled deb artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  repackage:
    runs-on: macos-latest
    steps:
      - name: Checkout renderer source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download known-working IPA and freshly compiled deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/deb"
          gh run download "${{ inputs.base_run_id }}" \
            --repo "${{ github.repository }}" \
            --name EeveeSpotify-IPA \
            --dir "$RUNNER_TEMP/base"
          gh run download "${{ inputs.deb_run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern 'com.eevee.spotify_*.deb' \
            --dir "$RUNNER_TEMP/deb"

      - name: Install package extractor
        run: brew install dpkg

      - name: Replace tweak payload in known-working IPA
        run: |
          set -euo pipefail
          BASE_IPA=$(find "$RUNNER_TEMP/base" -type f -name '*.ipa' | head -1)
          DEB_PATH=$(find "$RUNNER_TEMP/deb" -type f -name '*.deb' | head -1)
          [ -n "$BASE_IPA" ] || { echo "known-working IPA not found" >&2; exit 1; }
          [ -n "$DEB_PATH" ] || { echo "compiled deb not found" >&2; exit 1; }

          APP_WORK="$RUNNER_TEMP/app-work"
          DEB_WORK="$RUNNER_TEMP/deb-work"
          OUT_DIR="$RUNNER_TEMP/final"
          mkdir -p "$APP_WORK" "$DEB_WORK" "$OUT_DIR"
          unzip -q "$BASE_IPA" -d "$APP_WORK"
          dpkg-deb -x "$DEB_PATH" "$DEB_WORK"

          DYLIB_SRC=$(find "$DEB_WORK" -type f -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_WORK" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_WORK" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)
          DYLIB_DST=$(find "$APP_WORK/Payload" -type f -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_DST=$(find "$APP_WORK/Payload" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_DST=$(find "$APP_WORK/Payload" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          for required in "$DYLIB_SRC" "$BUNDLE_SRC" "$FRAMEWORK_SRC" "$DYLIB_DST" "$BUNDLE_DST" "$FRAMEWORK_DST"; do
            [ -n "$required" ] || { echo "required tweak component is missing" >&2; exit 1; }
          done

          install -m 0755 "$DYLIB_SRC" "$DYLIB_DST"
          rm -rf "$BUNDLE_DST" "$FRAMEWORK_DST"
          cp -R "$BUNDLE_SRC" "$BUNDLE_DST"
          cp -R "$FRAMEWORK_SRC" "$FRAMEWORK_DST"
          chmod 0755 "$FRAMEWORK_DST/EeveeSwiftProtobuf"

          cmp \
            "layout/Library/Application Support/EeveeSpotify.bundle/SpicyLyricsRenderer/renderer.js" \
            "$BUNDLE_DST/SpicyLyricsRenderer/renderer.js"
          cmp \
            "layout/Library/Application Support/EeveeSpotify.bundle/SpicyLyricsRenderer/renderer-model.js" \
            "$BUNDLE_DST/SpicyLyricsRenderer/renderer-model.js"

          MAIN_EXEC=$(find "$APP_WORK/Payload" -maxdepth 2 -type f -name Spotify | head -1)
          [ -n "$MAIN_EXEC" ] || { echo "Spotify executable not found" >&2; exit 1; }
          otool -L "$MAIN_EXEC" | grep -q 'EeveeSpotify.dylib'

          OUT_IPA="$OUT_DIR/EeveeSpotify-9.1.76-SpicyLyrics-Authoritative-4071eeb.ipa"
          (cd "$APP_WORK" && zip -qry "$OUT_IPA" .)
          unzip -tq "$OUT_IPA"
          echo "OUT_IPA=$OUT_IPA" >> "$GITHUB_ENV"

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-SpicyLyrics-Final
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
