name: Build IPA (NO PATCH)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      qa_only:
        description: "Run native/renderer/visual checks without rebuilding the package"
        default: false
        required: false
        type: boolean
      qa_scope:
        description: "QA-only scope; full package builds always run every check"
        default: all
        required: false
        type: choice
        options:
          - all
          - local_audio
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional — IPA build is skipped if empty)"
        default: ""
        required: false
        type: string
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Setup Theos
        if: ${{ !inputs.qa_only }}
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        if: ${{ !inputs.qa_only }}
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids api.github.com rate limit (anon 60/hr -> 403)
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        if: ${{ !inputs.qa_only }}
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Test Spicy Lyrics playback clock
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        run: |
          xcrun swiftc \
            Sources/EeveeSpotify/Lyrics/SpicyLyricsPlaybackClock.swift \
            Tests/SpicyLyricsPlaybackClock/main.swift \
            -o "$RUNNER_TEMP/spicy-lyrics-clock-tests"
          "$RUNNER_TEMP/spicy-lyrics-clock-tests"

      - name: Test Spicy Lyrics renderer bundle
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        run: python3 Tests/SpicyLyricsRenderer/test_bundle.py

      - name: Test shared lyric request lifetimes
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        run: |
          xcrun swiftc Sources/EeveeSpotify/Lyrics/SpicyLyricsRequestConsumers.swift \
            Tests/SpicyLyricsRequestConsumers/main.swift -o "$RUNNER_TEMP/spicy-request-tests"
          "$RUNNER_TEMP/spicy-request-tests"

      - name: Test native preview feed availability
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        run: |
          xcrun swiftc Sources/EeveeSpotify/Lyrics/SpicyLyricsNativePreview.swift \
            Tests/SpicyLyricsIOS/NativeScrollFeedFixture.swift \
            Tests/SpicyLyricsNativePreview/main.swift -o "$RUNNER_TEMP/spicy-native-preview-tests"
          "$RUNNER_TEMP/spicy-native-preview-tests"

      - name: Test Spicy Lyrics native control dispatch
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        run: bash Tests/SpicyLyricsNativeControls/run.sh

      - name: Test local audio import output
        run: bash Tests/LocalAudioImport/run.sh

      - name: Test local audio native UI
        if: ${{ inputs.qa_only && inputs.qa_scope == 'local_audio' }}
        timeout-minutes: 6
        run: bash Tests/LocalAudioIOS/run.sh

      - name: Upload local audio verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAudio-QA
          path: |
            ${{ runner.temp }}/local-audio-result.txt
            ${{ runner.temp }}/local-audio-ui-result.txt
            ${{ runner.temp }}/local-audio-ui-progress.txt
            ${{ runner.temp }}/local-audio-*.png
          if-no-files-found: warn

      - name: Test Spicy Lyrics in iOS WebKit and UIKit
        if: ${{ !inputs.qa_only || inputs.qa_scope != 'local_audio' }}
        timeout-minutes: 15
        run: bash Tests/SpicyLyricsIOS/run.sh

      - name: Upload shared-simulator local audio verification
        if: ${{ always() && (!inputs.qa_only || inputs.qa_scope != 'local_audio') }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalAudio-iOS-QA
          path: |
            ${{ runner.temp }}/local-audio-ui-result.txt
            ${{ runner.temp }}/local-audio-ui-progress.txt
            ${{ runner.temp }}/local-audio-*.png
          if-no-files-found: warn

      - name: Upload iOS integration result
        if: ${{ always() && (!inputs.qa_only || inputs.qa_scope != 'local_audio') }}
        uses: actions/upload-artifact@v4
        with:
          name: SpicyLyrics-iOS-QA
          path: |
            ${{ runner.temp }}/spicy-ios-qa-result.txt
            ${{ runner.temp }}/spicy-ios-qa-progress.txt
            ${{ runner.temp }}/spicy-metadata-qa-result.txt
            ${{ runner.temp }}/qa-renderer-baseline.json
            ${{ runner.temp }}/qa-renderer-results.json
            ${{ runner.temp }}/qa-portrait.png
            ${{ runner.temp }}/qa-landscape.png
            ${{ runner.temp }}/qa-landscape-screen.png
            ${{ runner.temp }}/qa-card.png
            ${{ runner.temp }}/qa-inline.png
            ${{ runner.temp }}/qa-embedded-context.png
            ${{ runner.temp }}/qa-card-bleed.png
            ${{ runner.temp }}/qa-availability.png
            ${{ runner.temp }}/qa-availability-screen.png
            ${{ runner.temp }}/qa-caption-after-skip.png
            ${{ runner.temp }}/qa-session.mp4
          if-no-files-found: warn

      - name: Build .deb (rootless)
        if: ${{ !inputs.qa_only }}
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH"   >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        if: ${{ !inputs.qa_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA build (only when ipa_url is provided) ───────────────────

      - uses: levibostian/action-hide-sensitive-inputs@v1 

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      #- name: Build zxPluginsInject.dylib
       # if: ${{ inputs.ipa_url != '' }}
        #run: |
         # chmod +x Tools/build-zxpi.sh
          # Tools/build-zxpi.sh

      - name: Fetch OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # -d enable documents, -u drop UISupportedDevices, -m floor MinOS,
          # -c max compress. Watch + native appex strip happens in the next
          # step via Tools/strip-ipa.sh.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Strip incompatible bundles
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "$OUT_IPA"

      - name: Add OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      # NOTE: Removed the post-injection ipapatch step.
      # If you later need it back, restore the "LC-inject zxPluginsInject (ipapatch)" step.
      
      - name: Strip Watch app (if any survived)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload
          
      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload IPA to filebin.net
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          BIN="eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"
