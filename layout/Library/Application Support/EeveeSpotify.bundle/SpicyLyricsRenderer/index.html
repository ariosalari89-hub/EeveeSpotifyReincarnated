<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Spicy Lyrics</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div id="artwork-backdrop" aria-hidden="true"></div>
  <div class="contrast-veil" aria-hidden="true"></div>

  <main id="app" aria-busy="true">
    <header class="topbar">
      <button id="close-button" class="icon-button" type="button" aria-label="Close lyrics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 9.3 5.3 5.3 5.3-5.3 1.4 1.4L12 17.4l-6.7-6.7z"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Spicy Lyrics</span>
      </div>
      <button id="settings-button" class="icon-button" type="button" aria-label="Lyrics settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm9 4.7v-1.8l-2.2-.8a7.3 7.3 0 0 0-.7-1.7l1-2.1-1.3-1.3-2.1 1a7.3 7.3 0 0 0-1.7-.7L13.2 3h-1.8l-.8 2.3a7.3 7.3 0 0 0-1.7.7l-2.1-1-1.3 1.3 1 2.1a7.3 7.3 0 0 0-.7 1.7l-2.3.8v1.8l2.3.8c.2.6.4 1.2.7 1.7l-1 2.1 1.3 1.3 2.1-1c.5.3 1.1.5 1.7.7l.8 2.3h1.8l.8-2.3c.6-.2 1.2-.4 1.7-.7l2.1 1 1.3-1.3-1-2.1c.3-.5.5-1.1.7-1.7z"/></svg>
      </button>
    </header>

    <section class="stage" aria-label="Now playing lyrics">
      <aside class="media-pane">
        <div class="cover-shell">
          <img id="cover" alt="" draggable="false">
          <div class="cover-shine" aria-hidden="true"></div>
        </div>
        <div class="media-copy">
          <h1 id="title">Spotify</h1>
          <p id="artist">Spicy Lyrics</p>
          <p id="album"></p>
        </div>
      </aside>

      <section class="lyrics-pane" aria-label="Lyrics">
        <div id="lyrics-scroller" tabindex="0">
          <div id="lyrics" aria-live="off"></div>
        </div>
        <button id="resume-scroll" class="resume-scroll" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5 6 6h-4v7h-4v-7H6z"/></svg>
          Follow lyrics
        </button>
        <div id="lyrics-state" class="lyrics-state" role="status">
          <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
          <p>Loading lyrics…</p>
        </div>
      </section>
    </section>

    <footer class="player-bar">
      <div class="mini-track">
        <img id="mini-cover" alt="" draggable="false">
        <div><strong id="mini-title">Spotify</strong><span id="mini-artist">Spicy Lyrics</span></div>
      </div>

      <div class="timeline">
        <span id="elapsed" aria-hidden="true">0:00</span>
        <div id="seek-control"><input id="seek" type="range" min="0" max="1" value="0" step="100" aria-label="Playback position"></div>
        <span id="duration" aria-hidden="true">0:00</span>
      </div>

      <div class="transport" role="group" aria-label="Playback controls">
        <button id="shuffle-button" class="transport-button state-button" type="button" aria-label="Turn shuffle on" aria-pressed="false">
          <svg class="smart-shuffle-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c1.1 5 3 6.9 8 8-5 1.1-6.9 3-8 8C6.9 11 5 9.1 0 8 5 6.9 6.9 5 8 0z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3H21v4.5h-2V6.4l-3.8 3.8-1.4-1.4L17.6 5H16.5zM3 6h3.1c2.2 0 3.6 1.3 4.8 3l-1.5 1.4C8.3 8.8 7.5 8 6.1 8H3zm15.6 10.6v-1.1h2V20h-4.5v-2h1.2l-3.8-3.8 1.4-1.4zM3 16h3.1c1.4 0 2.2-.8 3.3-2.4l4.4-6.2C15 5.7 16.3 5 18.2 5v2c-1.2 0-1.9.4-2.8 1.7L11 14.9C9.7 16.7 8.3 18 6.1 18H3z"/></svg>
        </button>
        <button id="previous-button" class="transport-button" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h2.5v18H4zm3 9L21 3v18z"/></svg>
        </button>
        <button id="play-button" class="play-button" type="button" aria-label="Play">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <button id="next-button" class="transport-button" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l14 9-14 9zm14.5 0H20v18h-2.5z"/></svg>
        </button>
        <button id="repeat-button" class="transport-button state-button" type="button" aria-label="Turn repeat on" aria-pressed="false" data-mode="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-4m3-3-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="repeat-one" aria-hidden="true">1</span>
        </button>
      </div>
    </footer>
  </main>

  <div id="settings-scrim" class="settings-scrim" hidden></div>
  <section id="settings-sheet" class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2 id="settings-title">Lyrics</h2>
      <button id="settings-close" class="icon-button" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.3 4.9 12.8 12.8-1.4 1.4L4.9 6.3zm11.4 0 1.4 1.4L6.3 19.1l-1.4-1.4z"/></svg>
      </button>
    </div>
    <label class="setting-row"><span><strong>Romanized lyrics</strong><small>Use transliterated text when available</small></span><input id="romanized-toggle" type="checkbox"></label>
    <label class="setting-row"><span><strong>Translations</strong><small>Show translated lines below lyrics</small></span><input id="translation-toggle" type="checkbox" checked></label>
    <label class="setting-row"><strong>Background style</strong><select id="background-style"><option value="artwork">Cover art</option><option value="gradient">Gradient</option></select></label>
    <label class="setting-row"><strong>Dynamic background</strong><input id="background-toggle" type="checkbox" checked></label>
    <label class="setting-range"><span><strong>Background speed</strong><output id="background-speed-output">1×</output></span><input id="background-speed" type="range" min="25" max="200" value="100" step="5" aria-label="Background speed"><small id="background-motion-note" hidden>Reduced Motion is on</small></label>
    <label class="setting-range"><span><strong>Lyric size</strong><output id="font-output">100%</output></span><input id="font-size" type="range" min="82" max="126" value="100" step="2" aria-label="Lyric size"></label>
    <label class="setting-range"><span><strong>Playback offset</strong><output id="offset-output">0 ms</output></span><small>Positive values delay lyrics; negative values show them earlier.</small><input id="playback-offset" type="range" min="-5000" max="5000" value="0" step="10" aria-label="Playback offset in milliseconds"></label>
    <p class="provider-note">Lyrics provided by Spicy Lyrics</p>
  </section>

  <script src="renderer-model.js?v=5"></script>
  <script src="renderer-effects.js?v=5"></script>
  <script src="renderer.js?v=5"></script>
</body>
</html>
